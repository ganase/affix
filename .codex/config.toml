# Affix用のプロジェクトローカルなCodex方針メモです。
# 実際に利用できるCodex設定キーは実行環境の版によって異なる場合があります。
# ここでは、このリポジトリで想定する安全寄りの運用モードを記録しています。

sandbox_mode = "workspace-write"
approval_policy = "on-request"
network_access = false

[project]
name = "affix"
purpose = "レビュー前提で安全性を優先する、アフィリエイトサイト自動運営システム。"

[safety]
handle_secrets = false
avoid_destructive_operations = true
require_human_approval_before_publish = true
do_not_edit_env_directly = true

[paths]
data = "data"
content = "content"
logs = "logs"
